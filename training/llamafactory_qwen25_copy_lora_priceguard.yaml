### model
model_name_or_path: /root/modelscope_models/Qwen/Qwen2.5-3B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 16
lora_dropout: 0
lora_target: all

### dataset
dataset: ecom_copy_sft
dataset_dir: /root/LLaMA-Factory/data
template: qwen
cutoff_len: 1536
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 4

### output
output_dir: /root/ecommerce-recommender-lab/training/outputs/qwen25-3b-copy-lora-priceguard-e8
logging_steps: 1
save_steps: 50
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 2
learning_rate: 2.0e-4
num_train_epochs: 8.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
ddp_timeout: 180000000

### eval
val_size: 0.03
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 20
