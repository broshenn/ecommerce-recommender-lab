<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>电商推荐 Step 5</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --line: #d9e0ea;
      --text: #1f2933;
      --muted: #657284;
      --brand: #0f766e;
      --soft: #e6f4f1;
      --price: #b4234c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      letter-spacing: 0;
    }

    header {
      padding: 20px 24px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: 20px;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 18px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 10px 24px rgba(31, 41, 51, 0.06);
    }

    .controls {
      padding: 16px;
      align-self: start;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    input, select, button {
      font: inherit;
      letter-spacing: 0;
    }

    input, select {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      padding: 7px 10px;
      cursor: pointer;
    }

    .chip.active {
      background: var(--soft);
      color: var(--brand);
      border-color: #8bc9c0;
      font-weight: 800;
    }

    .primary {
      width: 100%;
      min-height: 44px;
      margin-top: 16px;
      border: 0;
      border-radius: 8px;
      background: var(--brand);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    .primary:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .profile-box {
      margin-top: 14px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f9fbfd;
      color: var(--muted);
      font-size: 12px;
      display: grid;
      gap: 6px;
    }

    .products {
      display: grid;
      gap: 12px;
    }

    .summary {
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      color: var(--muted);
    }

    .summary strong {
      color: var(--text);
    }

    .product {
      display: grid;
      grid-template-columns: 118px minmax(0, 1fr);
      overflow: hidden;
    }

    .thumb {
      display: grid;
      place-items: center;
      background: #eef2f7;
      border-right: 1px solid var(--line);
      font-size: 28px;
      font-weight: 900;
      color: var(--brand);
      min-height: 132px;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 10px;
      background: #fff;
    }

    .body {
      padding: 14px;
      display: grid;
      gap: 7px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .name {
      margin: 0;
      font-size: 17px;
      overflow-wrap: anywhere;
    }

    .price {
      color: var(--price);
      font-weight: 900;
      white-space: nowrap;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
    }

    .source {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      padding: 3px 7px;
      border-radius: 8px;
      background: #fff4db;
      color: #9a640f;
      font-size: 12px;
    }

    .stock {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      width: fit-content;
      padding: 4px 8px;
      border-radius: 8px;
      background: #e8f7ef;
      color: #157347;
      font-size: 12px;
      font-weight: 800;
    }

    .stock.low {
      background: #fff4db;
      color: #9a640f;
    }

    .stock.limited {
      background: #ffe8ef;
      color: #b4234c;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 2px;
    }

    .action {
      min-height: 30px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      padding: 5px 9px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .action:hover {
      border-color: #8bc9c0;
      color: var(--brand);
    }

    .score {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }

    .score strong {
      color: var(--brand);
      font-size: 13px;
    }

    .empty {
      padding: 34px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 820px) {
      header { align-items: flex-start; flex-direction: column; }
      main { grid-template-columns: 1fr; }
      .product { grid-template-columns: 92px minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>电商推荐系统 Step 5</h1>
      <div class="subtitle">当前用户行为采集：查看、喜欢、不喜欢、加购会自动沉淀成画像</div>
    </div>
    <div id="health">检查服务中</div>
  </header>

  <main>
    <aside class="panel controls">
      <label for="userId">用户 ID</label>
      <input id="userId" value="u001" />

      <label for="numItems">推荐数量</label>
      <select id="numItems">
        <option value="3">3 个</option>
        <option value="5">5 个</option>
      </select>

      <label>偏好类目</label>
      <div class="chips" id="categories">
        <button class="chip active" data-value="手机">手机</button>
        <button class="chip active" data-value="电子数码">电子数码</button>
        <button class="chip" data-value="游戏">游戏</button>
        <button class="chip" data-value="办公">办公</button>
        <button class="chip" data-value="摄影">摄影</button>
      </div>

      <label for="likedBrands">偏好品牌</label>
      <input id="likedBrands" value="Bastmei, Sharp" />

      <label for="preferredTags">偏好标签</label>
      <input id="preferredTags" value="手机配件, 办公, 保护壳" />

      <div class="field-row">
        <div>
          <label for="budgetMin">最低预算</label>
          <input id="budgetMin" type="number" value="50" />
        </div>
        <div>
          <label for="budgetMax">最高预算</label>
          <input id="budgetMax" type="number" value="500" />
        </div>
      </div>

      <label for="recentViews">最近浏览商品 ID</label>
      <input id="recentViews" value="B07ZPSG8P5" />

      <button class="primary" id="recommendBtn">生成推荐</button>

      <div class="profile-box" id="profileBox">
        <strong>行为画像</strong>
        <span>暂无行为</span>
      </div>
    </aside>

    <section>
      <div class="panel summary">
        <span>策略：<strong id="strategy">-</strong></span>
        <span>商品数：<strong id="count">0</strong></span>
        <span>状态：<strong id="status">待生成</strong></span>
        <span id="reason">等待推荐</span>
      </div>
      <div class="products" id="products">
        <div class="panel empty">点击左侧按钮生成推荐</div>
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function selectedCategories() {
      return [...$("categories").querySelectorAll(".chip.active")]
        .map((chip) => chip.dataset.value);
    }

    function money(value) {
      return new Intl.NumberFormat("zh-CN", {
        style: "currency",
        currency: "CNY",
        maximumFractionDigits: 0
      }).format(value);
    }

    function renderProducts(products) {
      if (!products.length) {
        $("products").innerHTML = `<div class="panel empty">没有匹配到商品</div>`;
        return;
      }

      $("products").innerHTML = products.map((product) => `
        <article class="panel product">
          <div class="thumb">
            ${product.image_url ? `<img src="${product.image_url}" alt="${product.name}" loading="lazy" />` : product.category.slice(0, 1)}
          </div>
          <div class="body">
            <div class="row">
              <h2 class="name">${product.name}</h2>
              <div class="price">${money(product.price)}</div>
            </div>
            <div class="meta">${product.product_id} · ${product.category} · ${product.brand} · 库存 ${product.stock}</div>
            <div class="source">来源：${product.source_dataset}${product.rating ? ` · 评分 ${product.rating} / ${product.rating_count || 0}` : ""}</div>
            <div class="score">
              <strong>${product.recommendation_score} 分</strong>
              <span>${product.recommendation_reason}</span>
            </div>
            <div class="tags">${product.tags.map((tag) => `<span class="tag">${tag}</span>`).join("")}</div>
            <div class="stock ${product.stock_status}">
              ${product.stock_message}${product.purchase_limit ? ` · 限购 ${product.purchase_limit} 件` : ""}
            </div>
            <div class="actions">
              <button class="action" data-event="view" data-product-id="${product.product_id}">查看</button>
              <button class="action" data-event="like" data-product-id="${product.product_id}">喜欢</button>
              <button class="action" data-event="dislike" data-product-id="${product.product_id}">不喜欢</button>
              <button class="action" data-event="add_to_cart" data-product-id="${product.product_id}">加购</button>
            </div>
          </div>
        </article>
      `).join("");
    }

    async function recommend() {
      setLoading(true);
      const payload = {
        user_id: $("userId").value || "u001",
        scene: "homepage",
        num_items: Number($("numItems").value),
        preferred_categories: selectedCategories(),
        liked_brands: splitInput($("likedBrands").value),
        preferred_tags: splitInput($("preferredTags").value),
        budget_min: numberOrNull($("budgetMin").value),
        budget_max: numberOrNull($("budgetMax").value),
        recent_views: splitInput($("recentViews").value)
      };

      try {
        const res = await fetch("/api/v1/recommend", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const detail = await res.text();
          throw new Error(`推荐接口失败：${res.status} ${detail}`);
        }

        const data = await res.json();
        $("strategy").textContent = data.strategy;
        $("count").textContent = data.products.length;
        $("reason").textContent = data.reason;
        $("status").textContent = `已生成 ${new Date().toLocaleTimeString("zh-CN")}`;
        renderProducts(data.products);
        await loadProfile();
      } catch (error) {
        $("status").textContent = "生成失败";
        $("reason").textContent = error.message || "未知错误";
        $("products").innerHTML = `<div class="panel empty">推荐失败，请查看错误信息</div>`;
      } finally {
        setLoading(false);
      }
    }

    async function recordBehavior(productId, eventType) {
      try {
        setLoading(true, "记录中");
        const res = await fetch("/api/v1/events", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            user_id: $("userId").value || "u001",
            product_id: productId,
            event_type: eventType
          })
        });

        if (!res.ok) {
          const detail = await res.text();
          throw new Error(`行为接口失败：${res.status} ${detail}`);
        }

        await recommend();
      } catch (error) {
        $("status").textContent = "行为记录失败";
        $("reason").textContent = error.message || "未知错误";
        setLoading(false);
      }
    }

    async function loadProfile() {
      const userId = $("userId").value || "u001";
      const res = await fetch(`/api/v1/users/${encodeURIComponent(userId)}/profile`);
      if (!res.ok) return;
      const profile = await res.json();
      $("profileBox").innerHTML = `
        <strong>行为画像 · ${profile.event_count} 条行为</strong>
        <span>类目：${profile.preferred_categories.join("、") || "-"}</span>
        <span>品牌：${profile.liked_brands.join("、") || "-"}</span>
        <span>标签：${profile.preferred_tags.slice(0, 6).join("、") || "-"}</span>
        <span>最近浏览：${profile.recent_views.slice(0, 3).join("、") || "-"}</span>
        <span>不喜欢：${profile.disliked_products.slice(0, 3).join("、") || "-"}</span>
        <span>加购：${profile.cart_items.slice(0, 3).join("、") || "-"}</span>
      `;
    }

    function splitInput(value) {
      return value
        .split(/[,，]/)
        .map((item) => item.trim())
        .filter(Boolean);
    }

    function numberOrNull(value) {
      if (value === "") return null;
      const num = Number(value);
      return Number.isFinite(num) ? num : null;
    }

    function setLoading(isLoading, text = "生成中") {
      const button = $("recommendBtn");
      button.disabled = isLoading;
      button.textContent = isLoading ? text : "生成推荐";
      if (isLoading) {
        $("status").textContent = text;
      }
    }

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => chip.classList.toggle("active"));
    });

    $("recommendBtn").addEventListener("click", recommend);
    $("userId").addEventListener("change", loadProfile);
    $("products").addEventListener("click", (event) => {
      const button = event.target.closest("[data-event]");
      if (!button) return;
      recordBehavior(button.dataset.productId, button.dataset.event);
    });

    fetch("/health")
      .then((res) => res.json())
      .then((data) => $("health").textContent = `服务：${data.status} · Step ${data.step}`)
      .catch(() => $("health").textContent = "服务异常");

    loadProfile();
    recommend();
  </script>
</body>
</html>
